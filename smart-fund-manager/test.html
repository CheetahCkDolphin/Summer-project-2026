<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Funds Manager - Automated Test Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #38bdf8, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .summary-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .stat-val {
      font-size: 2rem;
      font-weight: 800;
    }
    .test-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }
    .test-desc {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .badge {
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>Smart Funds Manager - Browser Test Suite</h1>
  <p style="color: #94a3b8; margin-bottom: 1.5rem;">
    Verifying multi-persona workflows: Volunteer fundraising & withdrawals, Chapter Admin oversight, Non-Profit Admin national consolidation, and Google Sheets baseline integrity.
  </p>

  <div class="summary-card">
    <div>
      <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;">Total Tests</div>
      <div id="total-tests" class="stat-val" style="color: #38bdf8;">9</div>
    </div>
    <div>
      <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;">Passed</div>
      <div id="passed-tests" class="stat-val" style="color: #10b981;">0</div>
    </div>
    <div>
      <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;">Failed</div>
      <div id="failed-tests" class="stat-val" style="color: #ef4444;">0</div>
    </div>
    <div style="margin-left: auto;">
      <button class="btn" onclick="runTests()">Rerun All Tests</button>
      <a href="/smart-fund-manager/" style="color: #38bdf8; margin-left: 1rem; text-decoration: none; font-size: 0.9rem;">Open Application &rarr;</a>
    </div>
  </div>

  <div id="test-results"></div>

  <!-- Load Smart Funds Core Engine -->
  <script src="smart_funds.js?v=1"></script>
  <script>
    const testCases = [
      {
        id: 1,
        name: "Spreadsheet Baseline Data Integrity",
        desc: "Verifies 12 chapters exist with exact Google Sheet figures (Evergreen $20,070 raised, $13,186 withdrawn, $6,884 balance).",
        run() {
          SmartFunds.resetToDefault();
          const s = SmartFunds.state;
          if (s.chapters.length !== 12) throw new Error(`Expected 12 chapters, found ${s.chapters.length}`);
          const eg = s.chapters.find(c => c.name === "Evergreen Bay Area Chapter");
          if (!eg) throw new Error("Evergreen Bay Area Chapter missing");
          if (eg.raised !== 20070) throw new Error(`Expected raised 20070, got ${eg.raised}`);
          if (eg.withdrawals !== 13186) throw new Error(`Expected withdrawals 13186, got ${eg.withdrawals}`);
          if (eg.balance !== 6884) throw new Error(`Expected balance 6884, got ${eg.balance}`);
          return true;
        }
      },
      {
        id: 2,
        name: "Volunteer Persona Authentication",
        desc: "Verifies logging in as Shasta Mudda computes personal target, raised amount, and assigned projects.",
        run() {
          SmartFunds.login('volunteer', 'Shasta Mudda', 'Evergreen Bay Area Chapter');
          const m = SmartFunds.getVolunteerMetrics('Shasta Mudda');
          if (m.totalRaised !== 8810) throw new Error(`Expected raised 8810, got ${m.totalRaised}`);
          if (m.totalTarget !== 8810) throw new Error(`Expected target 8810, got ${m.totalTarget}`);
          if (m.volunteer.assignments.length < 3) throw new Error("Expected at least 3 project assignments");
          return true;
        }
      },
      {
        id: 3,
        name: "Volunteer Raise Funds Operation",
        desc: "Verifies logging a contribution updates volunteer, project, and chapter balances concurrently.",
        run() {
          const initChapter = SmartFunds.getChapterMetrics('Evergreen Bay Area Chapter');
          const initRaised = initChapter.totalRaised;
          
          SmartFunds.raiseFunds('Shasta Mudda', 'Mini-Library & Sports Club', 250, 'Donor A', 'Check #101');
          
          const updatedChapter = SmartFunds.getChapterMetrics('Evergreen Bay Area Chapter');
          if (updatedChapter.totalRaised !== initRaised + 250) {
            throw new Error(`Expected chapter raised to increase by 250, went from ${initRaised} to ${updatedChapter.totalRaised}`);
          }
          
          const volMetrics = SmartFunds.getVolunteerMetrics('Shasta Mudda');
          if (volMetrics.totalRaised !== 8810 + 250) {
            throw new Error(`Expected volunteer raised to be ${8810 + 250}, got ${volMetrics.totalRaised}`);
          }
          return true;
        }
      },
      {
        id: 4,
        name: "Volunteer Execute Project Milestones",
        desc: "Verifies updating project milestones updates status, percentage, and execution notes.",
        run() {
          SmartFunds.executeProject('Mini-Library & Sports Club', 100, 'Complete', 'All books and sports kits deployed');
          const p = SmartFunds.state.projects.find(proj => proj.name === 'Mini-Library & Sports Club');
          if (p.status !== 'Complete') throw new Error(`Expected Complete, got ${p.status}`);
          if (p.progress !== 100) throw new Error(`Expected 100%, got ${p.progress}`);
          return true;
        }
      },
      {
        id: 5,
        name: "Volunteer Withdraw Funds Operation",
        desc: "Verifies fund withdrawal succeeds within available balance and decreases project/chapter balance.",
        run() {
          const pName = "Education support and Seats of Hope for rural India Phase 2";
          const pBefore = SmartFunds.state.projects.find(p => p.name === pName);
          const initialBalance = pBefore.raised - pBefore.withdrawn;
          
          SmartFunds.withdrawFunds('Shasta Mudda', pName, 500, 'School Furniture Supplies', 'Receipt #WH-551');
          
          const pAfter = SmartFunds.state.projects.find(p => p.name === pName);
          const newBalance = pAfter.raised - pAfter.withdrawn;
          if (newBalance !== initialBalance - 500) {
            throw new Error(`Expected balance to decrease by 500, went from ${initialBalance} to ${newBalance}`);
          }
          return true;
        }
      },
      {
        id: 6,
        name: "Withdrawal Exceeding Balance Rejection",
        desc: "Verifies withdrawal validation rejects requests exceeding available project balance with an error.",
        run() {
          let threw = false;
          try {
            SmartFunds.withdrawFunds('Shasta Mudda', 'Aid4Afghans', 999999, 'Overdraw', 'None');
          } catch (e) {
            threw = true;
          }
          if (!threw) throw new Error("Expected withdrawal exceeding balance to throw an error, but it succeeded");
          return true;
        }
      },
      {
        id: 7,
        name: "Chapter Admin Persona Oversight",
        desc: "Verifies Chapter Admin portal aggregates all volunteers (Ojasvi, Shasta, etc.) and projects.",
        run() {
          SmartFunds.login('chapter_admin', 'Evergreen Admin', 'Evergreen Bay Area Chapter');
          const m = SmartFunds.getChapterMetrics('Evergreen Bay Area Chapter');
          if (m.volunteers.length < 5) throw new Error(`Expected at least 5 volunteers in Evergreen chapter, got ${m.volunteers.length}`);
          if (m.projects.length < 5) throw new Error(`Expected at least 5 projects in Evergreen chapter, got ${m.projects.length}`);
          return true;
        }
      },
      {
        id: 8,
        name: "Non-Profit Org Admin National Consolidation",
        desc: "Verifies Non-Profit Admin consolidates global metrics across all 12 chapters (Total raised > $60k).",
        run() {
          SmartFunds.login('nonprofit_admin', 'Chirag Hope Executive Admin', 'National Office');
          const m = SmartFunds.getNonprofitMetrics();
          if (m.totalChapters !== 12) throw new Error(`Expected 12 chapters, got ${m.totalChapters}`);
          if (m.totalRaised < 60000) throw new Error(`Expected total raised > 60000, got ${m.totalRaised}`);
          if (m.totalBalance <= 0) throw new Error(`Expected positive net balance, got ${m.totalBalance}`);
          return true;
        }
      },
      {
        id: 9,
        name: "Chapter Admin Volunteer Roster & Selection Deep-Dive",
        desc: "Verifies Chapter Admin populates all 12 volunteer tabs from Google Sheet 1 (Ojasvi, Shasta, Suravi, Hasini, Shreshtha, Esha, Pranati, Sindu, Samhita, Anh, General, Kaavya).",
        run() {
          SmartFunds.resetToDefault();
          const overview = SmartFunds.getChapterVolunteersOverview('Evergreen Bay Area Chapter');
          if (!overview || overview.length !== 12) {
            throw new Error(`Expected exactly 12 volunteer tabs from Sheet 1, got ${overview ? overview.length : 0}`);
          }
          
          // Verify Suravi & Hasini tabs from Sheet 1
          const suravi = overview.find(v => v.name === 'Suravi');
          if (!suravi) throw new Error("Suravi tab missing from chapter volunteers overview");
          const hasini = overview.find(v => v.name === 'Hasini');
          if (!hasini) throw new Error("Hasini tab missing from chapter volunteers overview");
          const esha = overview.find(v => v.name === 'Esha Shivakumar');
          if (!esha) throw new Error("Esha Shivakumar tab missing from chapter volunteers overview");

          // Verify Shasta Mudda
          const shasta = overview.find(v => v.name === 'Shasta Mudda');
          if (!shasta) throw new Error("Shasta Mudda missing from chapter roster overview");
          if (shasta.projectsCount !== 3) throw new Error(`Expected Shasta to have 3 projects, got ${shasta.projectsCount}`);
          if (shasta.totalRaised !== 8810) throw new Error(`Expected Shasta total raised 8810, got ${shasta.totalRaised}`);
          if (shasta.totalTarget !== 8810) throw new Error(`Expected Shasta total target 8810, got ${shasta.totalTarget}`);
          if (shasta.totalWithdrawn !== 6810) throw new Error(`Expected Shasta total withdrawn 6810, got ${shasta.totalWithdrawn}`);
          if (shasta.balance !== 2000) throw new Error(`Expected Shasta balance 2000, got ${shasta.balance}`);

          // Verify Ojasvi Mudda
          const ojasvi = SmartFunds.getChapterVolunteerDetail('Evergreen Bay Area Chapter', 'Ojasvi Mudda');
          if (!ojasvi) throw new Error("Ojasvi Mudda detail lookup failed");
          if (ojasvi.projectsCount !== 4) throw new Error(`Expected Ojasvi to have 4 projects, got ${ojasvi.projectsCount}`);
          if (ojasvi.totalRaised !== 7284) throw new Error(`Expected Ojasvi total raised 7284, got ${ojasvi.totalRaised}`);
          if (ojasvi.totalTarget !== 7284) throw new Error(`Expected Ojasvi total target 7284, got ${ojasvi.totalTarget}`);
          if (ojasvi.totalWithdrawn !== 5400) throw new Error(`Expected Ojasvi total withdrawn 5400, got ${ojasvi.totalWithdrawn}`);
          if (ojasvi.balance !== 1884) throw new Error(`Expected Ojasvi balance 1884, got ${ojasvi.balance}`);

          return true;
        }
      },
      {
        id: 10,
        name: "Chapter Admin Volunteer Selection Filters Roster and Details",
        desc: "Verifies that filtering by a specific volunteer isolates that volunteer in both detail lookup and roster overview filtering.",
        run() {
          SmartFunds.resetToDefault();
          const allVolunteers = SmartFunds.getChapterVolunteersOverview('Evergreen Bay Area Chapter');
          if (allVolunteers.length !== 12) {
            throw new Error(`Expected 12 total chapter volunteers, found ${allVolunteers.length}`);
          }
          
          const filteredTarget = "Shasta Mudda";
          const filtered = allVolunteers.filter(v => v.name.toLowerCase() === filteredTarget.toLowerCase());
          if (filtered.length !== 1) {
            throw new Error(`Expected 1 filtered volunteer for ${filteredTarget}, found ${filtered.length}`);
          }
          if (filtered[0].name !== "Shasta Mudda") {
            throw new Error(`Expected filtered volunteer to be Shasta Mudda, got ${filtered[0].name}`);
          }
          if (filtered[0].projectsCount !== 3) {
            throw new Error(`Expected 3 projects for Shasta, got ${filtered[0].projectsCount}`);
          }
          return true;
        }
      },
      {
        id: 11,
        name: "Chapter Admin Create Project Operation",
        desc: "Verifies creating a new project establishes target amount, chapter assignment, and volunteer linkage.",
        run() {
          SmartFunds.resetToDefault();
          const initCount = SmartFunds.state.projects.length;
          const res = SmartFunds.createProject('Evergreen Bay Area Chapter', 'Solar Lamps for Rural Schools', 1500, 'Solar lighting kits', 'Shasta Mudda', 'Planning');
          if (!res.success) throw new Error("Project creation failed");
          if (SmartFunds.state.projects.length !== initCount + 1) {
            throw new Error(`Expected ${initCount + 1} projects, found ${SmartFunds.state.projects.length}`);
          }
          const created = SmartFunds.state.projects.find(p => p.name === 'Solar Lamps for Rural Schools');
          if (!created) throw new Error("Created project not found in state");
          if (created.target !== 1500) throw new Error(`Expected target 1500, got ${created.target}`);
          
          const shasta = SmartFunds.state.volunteers.find(v => v.name === 'Shasta Mudda');
          const hasAssignment = shasta.assignments.some(a => a.project === 'Solar Lamps for Rural Schools');
          if (!hasAssignment) throw new Error("Volunteer assignment was not linked to Shasta Mudda");
          return true;
        }
      },
      {
        id: 12,
        name: "Chapter Admin Add Volunteer Operation",
        desc: "Verifies registering a new youth volunteer updates chapter roster and assigns initial project.",
        run() {
          SmartFunds.resetToDefault();
          const initVols = SmartFunds.getChapterVolunteersOverview('Evergreen Bay Area Chapter').length;
          const res = SmartFunds.addVolunteer('Evergreen Bay Area Chapter', 'Aarav Sharma', 'aarav@chiraghope.org', 'Aarav Sharma', 'Mini-Library & Sports Club', 500);
          if (!res.success) throw new Error("Add volunteer failed");
          
          const updatedVols = SmartFunds.getChapterVolunteersOverview('Evergreen Bay Area Chapter');
          if (updatedVols.length !== initVols + 1) {
            throw new Error(`Expected ${initVols + 1} volunteers, found ${updatedVols.length}`);
          }
          const aarav = updatedVols.find(v => v.name === 'Aarav Sharma');
          if (!aarav) throw new Error("Aarav Sharma not found in chapter roster overview");
          if (aarav.projectsCount !== 1) throw new Error(`Expected 1 assigned project for Aarav, got ${aarav.projectsCount}`);
          if (aarav.totalTarget !== 500) throw new Error(`Expected target 500, got ${aarav.totalTarget}`);
          return true;
        }
      },
      {
        id: 13,
        name: "Non-Profit Org Admin Create Chapter Operation",
        desc: "Verifies establishing a new regional chapter updates national aggregation metrics and chapter count.",
        run() {
          SmartFunds.resetToDefault();
          const initChapCount = SmartFunds.state.chapters.length;
          const res = SmartFunds.createChapter('Austin Chapter', 'Texas, USA', 12000);
          if (!res.success) throw new Error("Create chapter failed");
          if (SmartFunds.state.chapters.length !== initChapCount + 1) {
            throw new Error(`Expected ${initChapCount + 1} chapters, found ${SmartFunds.state.chapters.length}`);
          }
          const austin = SmartFunds.state.chapters.find(c => c.name === 'Austin Chapter');
          if (!austin) throw new Error("Austin Chapter not found in chapters state");
          if (austin.location !== 'Texas, USA') throw new Error(`Expected Texas, USA, got ${austin.location}`);
          return true;
        }
      },
      {
        id: 14,
        name: "Persona Portal Isolation Authentication & Routing Guard",
        desc: "Verifies that signing in as a volunteer, chapter admin, or non-profit admin isolates permissions and active persona context.",
        run() {
          SmartFunds.resetToDefault();
          // Volunteer login
          SmartFunds.login('volunteer', 'Shasta Mudda', 'Evergreen Bay Area Chapter');
          let user = SmartFunds.getActiveUser();
          if (!user || user.role !== 'volunteer') throw new Error("Expected active role volunteer");
          if (user.name !== 'Shasta Mudda') throw new Error("Expected active user Shasta Mudda");

          // Chapter Admin login
          SmartFunds.login('chapter_admin', 'Evergreen Admin', 'Evergreen Bay Area Chapter');
          user = SmartFunds.getActiveUser();
          if (!user || user.role !== 'chapter_admin') throw new Error("Expected active role chapter_admin");

          // Non-Profit Admin login
          SmartFunds.login('nonprofit_admin', 'National Executive', 'National Office');
          user = SmartFunds.getActiveUser();
          if (!user || user.role !== 'nonprofit_admin') throw new Error("Expected active role nonprofit_admin");

          // Platform Admin login
          SmartFunds.login('platform_admin', 'Smart Funds Platform Super Admin', 'Platform Headquarters');
          user = SmartFunds.getActiveUser();
          if (!user || user.role !== 'platform_admin') throw new Error("Expected active role platform_admin");
          if (user.name !== 'Smart Funds Platform Super Admin') throw new Error("Expected active user Smart Funds Platform Super Admin");

          // Logout
          SmartFunds.logout();
          user = SmartFunds.getActiveUser();
          if (user !== null) throw new Error("Expected activeUser to be null after logout");

          return true;
        }
      },
      {
        id: 15,
        name: "Smart Funds Platform Metrics & Baseline Organizations",
        desc: "Validates that platform metrics correctly aggregate Chirag Hope baseline with 12 chapters, $67,163 raised, and $28,505 net reserves.",
        run() {
          SmartFunds.resetToDefault();
          const orgs = SmartFunds.getOrganizationsSummary();
          if (!Array.isArray(orgs) || orgs.length < 1) throw new Error("Expected at least 1 organization in summary");
          const chirag = orgs.find(o => o.name.toLowerCase().includes("chirag"));
          if (!chirag) throw new Error("Chirag Hope baseline organization not found");
          if (chirag.totalRaised !== 67163.0) throw new Error(`Expected $67,163.00 raised, got ${chirag.totalRaised}`);
          if (chirag.totalWithdrawn !== 38658.0) throw new Error(`Expected $38,658.00 withdrawn, got ${chirag.totalWithdrawn}`);
          if (chirag.balance !== 28505.0) throw new Error(`Expected $28,505.00 balance, got ${chirag.balance}`);

          const platformMetrics = SmartFunds.getPlatformMetrics();
          if (platformMetrics.totalOrganizations < 1) throw new Error("Expected at least 1 organization in platform metrics");
          if (platformMetrics.totalChapters !== 12) throw new Error(`Expected 12 chapters, got ${platformMetrics.totalChapters}`);
          if (platformMetrics.totalRaised !== 67163.0) throw new Error(`Expected $67,163.00 total platform raised, got ${platformMetrics.totalRaised}`);
          return true;
        }
      },
      {
        id: 16,
        name: "Create Non-Profit Organization Operation & Multi-Tenant Registry",
        desc: "Verifies adding a new non-profit organization with EIN, headquarters location, mission, contact email, and duplicate prevention.",
        run() {
          SmartFunds.resetToDefault();
          const initCount = SmartFunds.getOrganizationsSummary().length;
          const res = SmartFunds.createOrganization(
            "Youth Literacy Global Foundation",
            "84-7654321",
            "San Francisco, CA",
            "contact@youthliteracy.org",
            "Literacy & Book Grants",
            "Dedicated to distributing books to underserved primary schools."
          );

          if (!res.success || !res.organization) throw new Error("Create organization did not return success");
          const orgs = SmartFunds.getOrganizationsSummary();
          if (orgs.length !== initCount + 1) throw new Error(`Expected ${initCount + 1} orgs, found ${orgs.length}`);

          const newOrg = orgs.find(o => o.name === "Youth Literacy Global Foundation");
          if (!newOrg) throw new Error("New organization not found in summary");
          if (newOrg.ein !== "84-7654321") throw new Error(`Expected EIN 84-7654321, got ${newOrg.ein}`);
          if (newOrg.cause !== "Literacy & Book Grants") throw new Error(`Expected Literacy & Book Grants, got ${newOrg.cause}`);

          // Test duplicate name prevention
          let threw = false;
          try {
            SmartFunds.createOrganization("Youth Literacy Global Foundation", "84-9999999", "Seattle, WA");
          } catch (e) {
            threw = true;
          }
          if (!threw) throw new Error("Expected duplicate organization creation to throw an error");

          return true;
        }
      }
    ];

    function runTests() {
      const container = document.getElementById('test-results');
      container.innerHTML = '';
      let passed = 0;
      let failed = 0;

      testCases.forEach(t => {
        const card = document.createElement('div');
        card.className = 'test-card';
        try {
          t.run();
          passed++;
          card.innerHTML = `
            <div>
              <div class="test-name">Test ${t.id}: ${t.name}</div>
              <div class="test-desc">${t.desc}</div>
            </div>
            <span class="badge badge-pass">PASS</span>
          `;
        } catch (err) {
          failed++;
          card.innerHTML = `
            <div>
              <div class="test-name">Test ${t.id}: ${t.name}</div>
              <div class="test-desc" style="color: #fca5a5;">${err.message}</div>
            </div>
            <span class="badge badge-fail">FAIL</span>
          `;
        }
        container.appendChild(card);
      });

      document.getElementById('passed-tests').textContent = passed;
      document.getElementById('failed-tests').textContent = failed;
    }

    window.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
